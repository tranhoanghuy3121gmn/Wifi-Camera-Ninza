<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cam Gi&aacute;m S&aacute;t N&#7897;i B&#7897;</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #0d0d0d; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    h2 { margin-top: 0; color: #4ade80; font-size: 20px; }
    .card { background: #1a1a1a; padding: 18px; border-radius: 12px; width: 100%; max-width: 480px; text-align: center; margin-bottom: 14px; border: 1px solid #333; }
    button { background: #22c55e; color: #000; border: none; padding: 13px 16px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin: 6px 0; width: 100%; }
    button.secondary { background: #333; color: #fff; }
    button.blue-btn { background: #2563eb; color: #fff; }
    button.pip-btn { background: #9333ea; color: #fff; }
    button.dark-mode-btn { background: #111; color: #666; border: 1px solid #222; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; text-align: center; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    .video-box { position: relative; width: 100%; max-width: 600px; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid #333; }
    video { width: 100%; display: block; background: #000; object-fit: cover; max-height: 70vh; }
    .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #4ade80; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; z-index: 10; }
    .code-box { font-size: 28px; font-weight: bold; letter-spacing: 3px; color: #4ade80; background: #000; padding: 10px; border-radius: 8px; margin: 8px 0; user-select: all; }
    #stealthOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; color: #222; align-items: center; justify-content: center; flex-direction: column; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- MAN HINH CHON VAI TRO -->
  <div id="setupScreen" class="card">
    <h2>Cam Gi&aacute;m S&aacute;t Wi-Fi</h2>
    <button onclick="startViewer()">1. M&aacute;y C&#7847;m Theo (M&agrave;n H&igrave;nh Xem)</button>
    <hr style="border-color:#333; margin: 16px 0;">
    <input type="text" id="roomInput" placeholder="Nh&#7853;p m&atilde; ph&ograve;ng (VD: 1234)" />
    <div class="row">
      <button class="secondary" onclick="startCamera('environment')">2A. Cam Sau</button>
      <button class="secondary" onclick="startCamera('user')">2B. Cam Tr&#432;&#7899;c</button>
    </div>
  </div>

  <!-- GIAO DIEN MAY XEM -->
  <div id="viewerScreen" class="card hidden">
    <div style="font-size:13px; color:#aaa;">Nh&#7853;p m&atilde; n&agrave;y v&agrave;o m&aacute;y &#273;&#7863;t &#7903; ngo&agrave;i:</div>
    <div id="myRoomId" class="code-box">&#272;ang t&#7841;o...</div>
    <div id="statusText" style="font-size:13px; color:#4ade80;">&#272;ang ch&#7901; camera k&#7871;t n&#7889;i...</div>

    <!-- NUT DIEU KHIEN & PIP -->
    <div id="viewerControls" class="hidden" style="margin-top: 12px; border-top: 1px solid #333; padding-top: 10px;">
      <button class="pip-btn" onclick="enablePiP()">&#10697; B&#7853;t C&#7917;a S&#7893; N&#7893;i (PiP)</button>
      <button class="blue-btn" onclick="requestSwitchCam()">&#8644; &#272;&#7893;i Cam Tr&#432;&#7899;c / Sau</button>
    </div>
  </div>

  <!-- KHUNG VIDEO TRUC TIEP -->
  <div id="videoContainer" class="video-box hidden">
    <div id="camBadge" class="badge">&#9679; LIVE</div>
    <video id="remoteVideo" autoplay muted playsinline></video>
  </div>

  <!-- GIAO DIEN MAY QUAY -->
  <div id="cameraScreen" class="card hidden">
    <div id="camStatusLabel" style="color:#4ade80; font-weight:bold; margin-bottom:10px;">&#9679; &#272;ang ph&aacute;t tr&#7921;c ti&#7871;p (T&#7855;t Flash)</div>
    <div class="video-box">
      <video id="localPreview" autoplay muted playsinline style="max-height: 240px;"></video>
    </div>
    <button class="dark-mode-btn" style="margin-top:12px;" onclick="toggleStealth(true)">L&agrave;m T&#7889;i &#272;en M&agrave;n H&igrave;nh (Ti&#7871;t Ki&#7879;m Pin)</button>
  </div>

  <!-- MAN HINH DEN CHONG CHU Y -->
  <div id="stealthOverlay" onclick="toggleStealth(false)">
    <div>&#272;ang ch&#7841;y ng&#7847;m...</div>
    <small style="margin-top:8px;">Ch&#7841;m v&agrave;o m&agrave;n h&igrave;nh &#273;&#7875; hi&#7879;n l&#7841;i</small>
  </div>

  <script>
    let peer = null;
    let activeStream = null;
    let activeCall = null;
    let dataConn = null;
    let currentFacing = 'environment';
    let isSwitching = false;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    async function keepAwake() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    function toggleStealth(show) {
      document.getElementById('stealthOverlay').style.display = show ? 'flex' : 'none';
    }

    // ================= 1. MAY XEM =================
    function startViewer() {
      const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('viewerScreen').classList.remove('hidden');
      keepAwake();

      peer = new Peer('cam-watch-' + randomCode, peerConfig);
      peer.on('open', () => {
        document.getElementById('myRoomId').innerText = randomCode;
      });

      peer.on('connection', (conn) => {
        dataConn = conn;
        document.getElementById('viewerControls').classList.remove('hidden');
        conn.on('data', (msg) => {
          if (msg.type === 'FACING_UPDATED') {
            document.getElementById('camBadge').innerText = msg.facing === 'user' ? '\u25cf Cam Tr\u01b0\u1edbc' : '\u25cf Cam Sau';
          }
        });
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          document.getElementById('statusText').innerText = '\u0110\u00e3 k\u1ebft n\u1ed1i camera!';
          document.getElementById('videoContainer').classList.remove('hidden');

          const vid = document.getElementById('remoteVideo');
          vid.srcObject = remoteStream;
          vid.play().catch(() => {});
        });
      });
    }

    // Kich hoat Picture-in-Picture (PiP) chuan cho ca iOS Safari va Chrome/Android
    async function enablePiP() {
      const vid = document.getElementById('remoteVideo');
      if (!vid || !vid.srcObject) return alert('Ch\u01b0a c\u00f3 h\u00ecnh \u1ea3nh camera!');

      try {
        if (vid.webkitSupportsPresentationMode && typeof vid.webkitSetPresentationMode === 'function') {
          // Chuan PiP rieng cua iOS Safari
          vid.webkitSetPresentationMode(vid.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
        } else if (document.pictureInPictureEnabled) {
          // Chuan PiP quoc te (Chrome, Edge, Android, macOS)
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          } else {
            await vid.requestPictureInPicture();
          }
        } else {
          alert('Tr\u00ecnh duy\u1ec7t n\u00e0y kh\u00f4ng h\u1ed7 tr\u1ee3 PiP. H\u00e3y m\u1edf b\u1eb1ng Safari!');
        }
      } catch (err) {
        alert('Kh\u00f4ng b\u1eadt \u0111\u01b0\u1ee3c PiP: ' + err.message);
      }
    }

    function requestSwitchCam() {
      if (dataConn && dataConn.open) {
        dataConn.send({ type: 'SWITCH_CAM' });
      }
    }

    // ================= 2. MAY QUAY =================
    async function startCamera(facing) {
      const roomCode = document.getElementById('roomInput').value.trim();
      if (!roomCode) return alert('Vui l\u00f2ng nh\u1eadp m\u00e3 ph\u00f2ng!');
      currentFacing = facing;

      try {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('cameraScreen').classList.remove('hidden');
        updateCamLabel();

        const preview = document.getElementById('localPreview');
        preview.srcObject = activeStream;
        await preview.play().catch(() => {});
        keepAwake();

        peer = new Peer(peerConfig);
        peer.on('open', () => {
          dataConn = peer.connect('cam-watch-' + roomCode);
          dataConn.on('open', () => {
            dataConn.send({ type: 'FACING_UPDATED', facing: currentFacing });
          });

          dataConn.on('data', (cmd) => {
            if (cmd.type === 'SWITCH_CAM') {
              switchCamera();
            }
          });

          activeCall = peer.call('cam-watch-' + roomCode, activeStream);
        });
      } catch (err) {
        alert('L\u1ed7i m\u1edf camera: ' + err.message);
      }
    }

    function updateCamLabel() {
      document.getElementById('camStatusLabel').innerText =
        '\u25cf \u0110ang ph\u00e1t ' + (currentFacing === 'user' ? 'Cam Tr\u01b0\u1edbc' : 'Cam Sau') + ' (T\u1eaft Flash)';
    }

    async function switchCamera() {
      if (isSwitching || !activeCall) return;
      isSwitching = true;

      try {
        if (activeStream) {
          activeStream.getTracks().forEach(t => t.stop());
        }

        currentFacing = (currentFacing === 'environment') ? 'user' : 'environment';
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        activeStream = newStream;
        const preview = document.getElementById('localPreview');
        preview.srcObject = newStream;
        await preview.play().catch(() => {});

        const newTrack = newStream.getVideoTracks()[0];
        const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) {
          await sender.replaceTrack(newTrack);
        }

        updateCamLabel();
        if (dataConn && dataConn.open) {
          dataConn.send({ type: 'FACING_UPDATED', facing: currentFacing });
        }
      } catch (e) {
        alert('Kh\u00f4ng \u0111\u1ed5i \u0111\u01b0\u1ee3c camera: ' + e.message);
      } finally {
        isSwitching = false;
      }
    }
  </script>
</body>
</html>
