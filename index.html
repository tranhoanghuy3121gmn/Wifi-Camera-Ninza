<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cam Gi&aacute;m S&aacute;t N&#7897;i B&#7897;</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #0d0d0d; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    h2 { margin-top: 0; color: #4ade80; font-size: 20px; }
    .card { background: #1a1a1a; padding: 18px; border-radius: 12px; width: 100%; max-width: 500px; text-align: center; margin-bottom: 14px; border: 1px solid #333; }
    button { background: #22c55e; color: #000; border: none; padding: 13px 16px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin: 6px 0; width: 100%; }
    button.secondary { background: #333; color: #fff; }
    button.alt-btn { background: #eab308; color: #000; }
    button.blue-btn { background: #2563eb; color: #fff; }
    button.dark-mode-btn { background: #111; color: #666; border: 1px solid #222; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; text-align: center; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .row input { margin-bottom: 0; flex: 1; }
    .row button { margin: 0; flex: 1.5; }
    .video-box { position: relative; width: 100%; max-width: 600px; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid #333; min-height: 260px; }
    video { width: 100%; display: block; object-fit: cover; }
    canvas.freeze-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 10; display: none; }
    .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #4ade80; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; z-index: 20; }
    .code-box { font-size: 28px; font-weight: bold; letter-spacing: 3px; color: #4ade80; background: #000; padding: 10px; border-radius: 8px; margin: 8px 0; user-select: all; }
    #stealthOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; color: #222; align-items: center; justify-content: center; flex-direction: column; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- MAN HINH CHON VAI TRO -->
  <div id="setupScreen" class="card">
    <h2>Cam Gi&aacute;m S&aacute;t Wi-Fi</h2>
    <button onclick="startViewer()">1. M&aacute;y C&#7847;m Theo (M&agrave;n H&igrave;nh Xem)</button>
    <hr style="border-color:#333; margin: 16px 0;">
    <input type="text" id="roomInput" placeholder="Nh&#7853;p m&atilde; ph&ograve;ng (VD: 1234)" />
    
    <div style="text-align:left; font-size:13px; color:#aaa; margin: 10px 0 4px;">Ch&#7871; &#273;&#7897; 1: B&igrave;nh th&#432;&#7901;ng (1 Camera)</div>
    <div class="row" style="margin-top:0;">
      <button class="secondary" onclick="startNormalMode('environment')">Cam Sau</button>
      <button class="secondary" onclick="startNormalMode('user')">Cam Tr&#432;&#7899;c</button>
    </div>

    <div style="text-align:left; font-size:13px; color:#eab308; margin: 14px 0 4px;">Ch&#7871; &#273;&#7897; 2: Lu&acirc;n phi&ecirc;n ch&#7889;ng ch&#7899;p &#273;en</div>
    <div class="row" style="margin-top:0;">
      <input type="number" id="initInterval" value="0.5" step="0.1" min="0.2" placeholder="Gi&acirc;y" />
      <button class="alt-btn" onclick="startAutoSwitchMode()">B&#7855;t &#272;&#7847;u Lu&acirc;n Phi&ecirc;n</button>
    </div>
  </div>

  <!-- GIAO DIEN MAY XEM -->
  <div id="viewerScreen" class="card hidden">
    <div style="font-size:13px; color:#aaa;">Nh&#7853;p m&atilde; n&agrave;y v&agrave;o m&aacute;y &#273;&#7863;t &#7903; ngo&agrave;i:</div>
    <div id="myRoomId" class="code-box">&#272;ang t&#7841;o...</div>
    <div id="statusText" style="font-size:13px; color:#4ade80;">&#272;ang ch&#7901; camera k&#7871;t n&#7889;i...</div>

    <!-- BANG DIEU KHIEN TU XA TREN MAY XEM -->
    <div id="remoteControls" class="hidden" style="margin-top: 12px; border-top: 1px solid #333; padding-top: 12px;">
      <button class="blue-btn" onclick="sendCmd({ type: 'SWITCH_ONCE' })">&#8644; &#272;&#7893;i Cam Tr&#432;&#7899;c / Sau Ngay</button>
      <div class="row">
        <input type="number" id="remoteInterval" value="0.5" step="0.1" min="0.2" placeholder="Gi&acirc;y" />
        <button class="alt-btn" onclick="updateRemoteInterval()">T&#7921; &#272;&#7893;i M&#7895;i (Gi&acirc;y)</button>
      </div>
      <button class="secondary" style="margin-top:8px; font-size:13px; padding:9px;" onclick="sendCmd({ type: 'STOP_AUTO' })">D&#7915;ng T&#7921; &#272;&#7893;i (Gi&#7919; Nguy&ecirc;n G&oacute;c N&agrave;y)</button>
    </div>
  </div>

  <!-- KHUNG HINH VIDEO CHONG CHOP DEN -->
  <div id="viewerVideoContainer" class="video-box hidden">
    <div id="camAngleBadge" class="badge">&#272;ang k&#7871;t n&#7889;i...</div>
    <video id="remoteVideo" autoplay muted playsinline></video>
    <canvas id="viewerFreezeCanvas" class="freeze-layer"></canvas>
  </div>

  <!-- GIAO DIEN MAY QUAY -->
  <div id="cameraScreen" class="card hidden">
    <div id="camModeLabel" style="color:#4ade80; font-weight:bold; margin-bottom:8px;">&#9679; &#272;ang ph&aacute;t tr&#7921;c ti&#7871;p (T&#7855;t Flash)</div>
    <div class="video-box" style="min-height: 200px;">
      <video id="localPreview" autoplay muted playsinline></video>
      <canvas id="localFreezeCanvas" class="freeze-layer"></canvas>
    </div>
    <button class="dark-mode-btn" style="margin-top:12px;" onclick="toggleStealth(true)">L&agrave;m T&#7889;i &#272;en M&agrave;n H&igrave;nh (Ti&#7871;t Ki&#7879;m Pin)</button>
  </div>

  <!-- MAN HINH DEN CHONG CHU Y -->
  <div id="stealthOverlay" onclick="toggleStealth(false)">
    <div>&#272;ang ch&#7841;y ng&#7847;m...</div>
    <small style="margin-top:8px;">Ch&#7841;m v&agrave;o m&agrave;n h&igrave;nh &#273;&#7875; hi&#7879;n l&#7841;i</small>
  </div>

  <script>
    let peer = null;
    let activeStream = null;
    let activeCall = null;
    let dataConn = null;
    let currentFacing = 'environment';
    let autoTimer = null;
    let isSwitching = false;
    let intervalSec = 0.5;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    async function keepAwake() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    function toggleStealth(show) {
      document.getElementById('stealthOverlay').style.display = show ? 'flex' : 'none';
    }

    // Chup khung hinh cuoi cung len Canvas de che man hinh den khi doi cam
    function freezeVideoFrame(videoEl, canvasEl) {
      if (!videoEl || videoEl.videoWidth === 0) return;
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
      const ctx = canvasEl.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
      canvasEl.style.display = 'block';
    }

    function unfreezeVideoFrame(canvasEl) {
      canvasEl.style.display = 'none';
    }

    // ================= 1. MAY XEM =================
    function startViewer() {
      const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('viewerScreen').classList.remove('hidden');
      keepAwake();

      peer = new Peer('cam-watch-' + randomCode, peerConfig);
      peer.on('open', () => {
        document.getElementById('myRoomId').innerText = randomCode;
      });

      peer.on('connection', (conn) => {
        dataConn = conn;
        document.getElementById('remoteControls').classList.remove('hidden');

        // Nhan tin hieu dong bang / mo bang khung hinh tu may quay
        conn.on('data', (msg) => {
          const rVideo = document.getElementById('remoteVideo');
          const rCanvas = document.getElementById('viewerFreezeCanvas');

          if (msg.type === 'FREEZE') {
            freezeVideoFrame(rVideo, rCanvas);
          } else if (msg.type === 'UNFREEZE') {
            document.getElementById('camAngleBadge').innerText = msg.facing === 'user' ? 'Camera Tr\u01b0\u1edbc' : 'Camera Sau';
            // Doi them 150ms cho luong video moi on dinh khung hinh roi moi go anh tinh
            setTimeout(() => unfreezeVideoFrame(rCanvas), 150);
          } else if (msg.type === 'SYNC_INTERVAL') {
            document.getElementById('remoteInterval').value = msg.sec;
          }
        });
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          document.getElementById('statusText').innerText = '\u0110\u00e3 k\u1ebft n\u1ed1i h\u00ecnh \u1ea3nh!';
          document.getElementById('viewerVideoContainer').classList.remove('hidden');
          const vid = document.getElementById('remoteVideo');
          vid.srcObject = remoteStream;
          vid.play().catch(() => {});
        });
      });
    }

    function sendCmd(payload) {
      if (dataConn && dataConn.open) {
        dataConn.send(payload);
      }
    }

    function updateRemoteInterval() {
      const sec = parseFloat(document.getElementById('remoteInterval').value);
      if (isNaN(sec) || sec < 0.2) return alert('Nh\u1eadp s\u1ed1 gi\u00e2y t\u1ed1i thi\u1ec3u 0.2s');
      sendCmd({ type: 'SET_AUTO', sec: sec });
    }

    // ================= 2. MAY QUAY =================
    async function startNormalMode(facing) {
      const roomCode = document.getElementById('roomInput').value.trim();
      if (!roomCode) return alert('Vui l\u00f2ng nh\u1eadp m\u00e3 ph\u00f2ng!');
      currentFacing = facing;
      await initCameraAndConnect(roomCode, false);
    }

    async function startAutoSwitchMode() {
      const roomCode = document.getElementById('roomInput').value.trim();
      if (!roomCode) return alert('Vui l\u00f2ng nh\u1eadp m\u00e3 ph\u00f2ng!');
      const sec = parseFloat(document.getElementById('initInterval').value);
      intervalSec = (isNaN(sec) || sec < 0.2) ? 0.5 : sec;
      await initCameraAndConnect(roomCode, true);
    }

    async function initCameraAndConnect(roomCode, isAuto) {
      try {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing, width: { ideal: 960 }, height: { ideal: 540 } },
          audio: false
        });

        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('cameraScreen').classList.remove('hidden');
        const preview = document.getElementById('localPreview');
        preview.srcObject = activeStream;
        await preview.play().catch(() => {});
        keepAwake();

        peer = new Peer(peerConfig);
        peer.on('open', () => {
          dataConn = peer.connect('cam-watch-' + roomCode);
          dataConn.on('open', () => {
            dataConn.send({ type: 'UNFREEZE', facing: currentFacing });
            dataConn.send({ type: 'SYNC_INTERVAL', sec: intervalSec });
            if (isAuto) startAutoLoop();
          });

          // Lang nghe lenh dieu khien tu may xem
          dataConn.on('data', (cmd) => {
            if (cmd.type === 'SWITCH_ONCE') {
              stopAutoLoop();
              switchCameraSmooth();
            } else if (cmd.type === 'SET_AUTO') {
              intervalSec = cmd.sec;
              startAutoLoop();
            } else if (cmd.type === 'STOP_AUTO') {
              stopAutoLoop();
            }
          });

          activeCall = peer.call('cam-watch-' + roomCode, activeStream);
        });
      } catch (err) {
        alert('Kh\u00f4ng m\u1edf \u0111\u01b0\u1ee3c camera: ' + err.message);
      }
    }

    function startAutoLoop() {
      stopAutoLoop();
      document.getElementById('camModeLabel').innerText = '\u25cf Lu\u00e2n phi\u00ean m\u1ed7i ' + intervalSec + ' gi\u00e2y';
      
      // Dung setTimeout de quy de dam bao camera moi da len hinh xong moi dem nguoc tiep
      const loop = async () => {
        await switchCameraSmooth();
        if (autoTimer !== null) {
          autoTimer = setTimeout(loop, intervalSec * 1000);
        }
      };
      autoTimer = setTimeout(loop, intervalSec * 1000);
    }

    function stopAutoLoop() {
      if (autoTimer) {
        clearTimeout(autoTimer);
        autoTimer = null;
      }
      document.getElementById('camModeLabel').innerText = '\u25cf \u0110ang ph\u00e1t 1 g\u00f3c c\u1ed1 \u0111\u1ecbnh';
    }

    async function switchCameraSmooth() {
      if (isSwitching || !activeCall) return;
      isSwitching = true;

      const preview = document.getElementById('localPreview');
      const localCanvas = document.getElementById('localFreezeCanvas');

      try {
        // 1. Dong bang khung hinh cuoi cung tren ca 2 may truoc khi tat cam
        freezeVideoFrame(preview, localCanvas);
        if (dataConn && dataConn.open) dataConn.send({ type: 'FREEZE' });

        // 2. Giai phong camera cu
        if (activeStream) {
          activeStream.getTracks().forEach(t => t.stop());
        }

        // 3. Doi chieu camera va mo luong moi
        currentFacing = (currentFacing === 'environment') ? 'user' : 'environment';
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing, width: { ideal: 960 }, height: { ideal: 540 } },
          audio: false
        });

        activeStream = newStream;
        preview.srcObject = newStream;
        await preview.play().catch(() => {});

        // 4. Thay the track video truyen di
        const newTrack = newStream.getVideoTracks()[0];
        const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) {
          await sender.replaceTrack(newTrack);
        }

        // 5. Go bo lop anh tinh sau khi hinh moi da san sang
        setTimeout(() => unfreezeVideoFrame(localCanvas), 150);
        if (dataConn && dataConn.open) {
          dataConn.send({ type: 'UNFREEZE', facing: currentFacing });
        }
      } catch (e) {
        unfreezeVideoFrame(localCanvas);
        if (dataConn && dataConn.open) dataConn.send({ type: 'UNFREEZE', facing: currentFacing });
      } finally {
        isSwitching = false;
      }
    }
  </script>
</body>
</html>
