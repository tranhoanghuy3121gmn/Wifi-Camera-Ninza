<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wi-Fi Cam</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    body { margin: 0; background: #09090b; color: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: #18181b; padding: 24px 20px; border-radius: 16px; width: 100%; max-width: 420px; text-align: center; margin-bottom: 14px; border: 1px solid #27272a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { margin: 0 0 20px; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
    button { background: #22c55e; color: #052e16; border: none; padding: 14px 18px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; transition: transform 0.1s, opacity 0.15s; }
    button:active { transform: scale(0.98); opacity: 0.9; }
    button.join-btn { background: #fafafa; color: #09090b; }
    button.blue-btn { background: #2563eb; color: #fff; margin-top: 8px; }
    button.pip-btn { background: #7c3aed; color: #fff; }
    button.stealth-btn { background: #27272a; color: #a1a1aa; margin-top: 12px; font-size: 14px; }
    .divider { height: 1px; background: #27272a; margin: 20px 0; }
    input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #3f3f46; background: #09090b; color: #fff; font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 10px; outline: none; letter-spacing: 2px; }
    input:focus { border-color: #22c55e; }
    input::placeholder { letter-spacing: 0; font-weight: 400; font-size: 15px; color: #71717a; }
    .code-box { font-size: 36px; font-weight: 800; letter-spacing: 6px; color: #4ade80; background: #09090b; padding: 14px; border-radius: 12px; margin: 10px 0; border: 1px solid #27272a; user-select: all; }
    .sub-text { font-size: 13px; color: #a1a1aa; }
    .video-box { position: relative; width: 100%; max-width: 560px; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid #27272a; }
    video { width: 100%; display: block; background: #000; object-fit: cover; max-height: 70vh; }
    .badge { position: absolute; top: 12px; left: 12px; background: rgba(9,9,11,0.75); backdrop-filter: blur(6px); color: #4ade80; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; z-index: 10; }
    #stealthOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; color: #27272a; align-items: center; justify-content: center; flex-direction: column; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- MAN HINH CHINH -->
  <div id="setupScreen" class="card">
    <h2>Wi-Fi Cam</h2>
    <button onclick="createRoom()">T&#7841;o ph&ograve;ng</button>
    <div class="divider"></div>
    <input type="tel" id="roomInput" maxlength="6" placeholder="Nh&#7853;p m&atilde; ph&ograve;ng" />
    <button class="join-btn" onclick="joinRoom()">Tham gia ph&ograve;ng</button>
  </div>

  <!-- GIAO DIEN PHONG DA TAO -->
  <div id="viewerScreen" class="card hidden">
    <div class="sub-text">M&atilde; ph&ograve;ng</div>
    <div id="myRoomId" class="code-box">----</div>
    <div id="statusText" class="sub-text" style="color:#4ade80;">&#272;ang ch&#7901; k&#7871;t n&#7889;i...</div>

    <div id="viewerControls" class="hidden" style="margin-top: 16px;">
      <button class="pip-btn" onclick="enablePiP()">C&#7917;a s&#7893; n&#7893;i (PiP)</button>
      <button class="blue-btn" onclick="requestCycleCam()">&#272;&#7893;i camera</button>
    </div>
  </div>

  <!-- KHUNG VIDEO -->
  <div id="videoContainer" class="video-box hidden">
    <div id="camBadge" class="badge">&#9679; LIVE</div>
    <video id="remoteVideo" autoplay muted playsinline></video>
  </div>

  <!-- GIAO DIEN THIET BI PHAT -->
  <div id="cameraScreen" class="card hidden">
    <div id="camStatusLabel" style="color:#4ade80; font-weight:600; font-size:14px; margin-bottom:12px;">&#9679; &#272;ang ph&aacute;t</div>
    <div class="video-box">
      <video id="localPreview" autoplay muted playsinline style="max-height: 240px;"></video>
    </div>
    <button class="stealth-btn" onclick="toggleStealth(true)">T&#7855;t m&agrave;n h&igrave;nh</button>
  </div>

  <!-- MAN HINH DEN -->
  <div id="stealthOverlay" onclick="toggleStealth(false)">
    <small>Ch&#7841;m &#273;&#7875; m&#7903; l&#7841;i</small>
  </div>

  <script>
    let peer = null;
    let activeStream = null;
    let activeCall = null;
    let dataConn = null;

    let cameraList = [];
    let currentCamIdx = 0;
    let isSwitching = false;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    async function keepAwake() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    function toggleStealth(show) {
      document.getElementById('stealthOverlay').style.display = show ? 'flex' : 'none';
    }

    // ================= 1. TAO PHONG =================
    function createRoom() {
      const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('viewerScreen').classList.remove('hidden');
      keepAwake();

      peer = new Peer('cam-watch-' + randomCode, peerConfig);
      peer.on('open', () => {
        document.getElementById('myRoomId').innerText = randomCode;
      });

      peer.on('connection', (conn) => {
        dataConn = conn;
        document.getElementById('viewerControls').classList.remove('hidden');
        conn.on('data', (msg) => {
          if (msg.type === 'CAM_INFO') {
            document.getElementById('camBadge').innerText = '\u25cf ' + msg.label;
          }
        });
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          document.getElementById('statusText').innerText = '\u0110\u00e3 k\u1ebft n\u1ed1i';
          document.getElementById('videoContainer').classList.remove('hidden');

          const vid = document.getElementById('remoteVideo');
          vid.srcObject = remoteStream;
          vid.play().catch(() => {});
        });
      });
    }

    async function enablePiP() {
      const vid = document.getElementById('remoteVideo');
      if (!vid || !vid.srcObject) return;
      try {
        if (vid.webkitSupportsPresentationMode && typeof vid.webkitSetPresentationMode === 'function') {
          vid.webkitSetPresentationMode(vid.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
        } else if (document.pictureInPictureEnabled) {
          if (document.pictureInPictureElement) await document.exitPictureInPicture();
          else await vid.requestPictureInPicture();
        }
      } catch (err) {}
    }

    function requestCycleCam() {
      if (dataConn && dataConn.open) {
        dataConn.send({ type: 'CYCLE_CAM' });
      }
    }

    // ================= 2. THAM GIA PHONG =================
    async function joinRoom() {
      const roomCode = document.getElementById('roomInput').value.trim();
      if (!roomCode) return alert('Vui l\u00f2ng nh\u1eadp m\u00e3 ph\u00f2ng!');

      try {
        // Mac dinh mo Camera Truoc
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        await scanDeviceCameras();
        currentCamIdx = 0;

        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('cameraScreen').classList.remove('hidden');
        updateLocalLabel();

        const preview = document.getElementById('localPreview');
        preview.srcObject = activeStream;
        await preview.play().catch(() => {});
        keepAwake();

        peer = new Peer(peerConfig);
        peer.on('open', () => {
          dataConn = peer.connect('cam-watch-' + roomCode);
          dataConn.on('open', () => {
            sendCamInfo();
          });

          dataConn.on('data', (cmd) => {
            if (cmd.type === 'CYCLE_CAM') {
              cycleNextCamera();
            }
          });

          activeCall = peer.call('cam-watch-' + roomCode, activeStream);
        });
      } catch (err) {
        alert('Kh\u00f4ng m\u1edf \u0111\u01b0\u1ee3c camera: ' + err.message);
      }
    }

    async function scanDeviceCameras() {
      const currentTrack = activeStream.getVideoTracks()[0];
      const currentId = currentTrack.getSettings().deviceId;
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videos = devices.filter(d => d.kind === 'videoinput');

      if (videos.length >= 2) {
        const first = videos.find(d => d.deviceId === currentId) || videos[0];
        cameraList = [{ deviceId: first.deviceId, label: formatCamName(first.label, 1) }];
        let count = 2;
        for (const d of videos) {
          if (d.deviceId !== first.deviceId) {
            cameraList.push({ deviceId: d.deviceId, label: formatCamName(d.label, count++) });
          }
        }
      } else {
        cameraList = [
          { facingMode: 'user', label: 'Cam Tr\u01b0\u1edbc' },
          { facingMode: 'environment', label: 'Cam Sau' }
        ];
      }
    }

    function formatCamName(rawLabel, idx) {
      if (!rawLabel) return 'Camera ' + idx;
      const lower = rawLabel.toLowerCase();
      if (lower.includes('front')) return 'Cam Tr\u01b0\u1edbc';
      if (lower.includes('ultra wide')) return 'Cam G\u00f3c R\u1ed9ng (0.5x)';
      if (lower.includes('telephoto')) return 'Cam Tele';
      if (lower.includes('back')) return 'Cam Sau';
      return rawLabel;
    }

    function updateLocalLabel() {
      const cam = cameraList[currentCamIdx];
      document.getElementById('camStatusLabel').innerText = '\u25cf ' + (cam ? cam.label : '\u0110ang ph\u00e1t') + ' (' + (currentCamIdx + 1) + '/' + cameraList.length + ')';
    }

    function sendCamInfo() {
      if (dataConn && dataConn.open) {
        const cam = cameraList[currentCamIdx];
        dataConn.send({ type: 'CAM_INFO', label: cam ? cam.label : 'LIVE' });
      }
    }

    async function cycleNextCamera() {
      if (isSwitching || !activeCall || cameraList.length < 2) return;
      isSwitching = true;

      try {
        if (activeStream) {
          activeStream.getTracks().forEach(t => t.stop());
        }

        currentCamIdx = (currentCamIdx + 1) % cameraList.length;
        const nextCam = cameraList[currentCamIdx];

        let newStream;
        try {
          const constraints = nextCam.deviceId
            ? { deviceId: { exact: nextCam.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
            : { facingMode: nextCam.facingMode, width: { ideal: 1280 }, height: { ideal: 720 } };
          newStream = await navigator.mediaDevices.getUserMedia({ video: constraints, audio: false });
        } catch (e) {
          const fallback = nextCam.deviceId ? { deviceId: nextCam.deviceId } : { facingMode: nextCam.facingMode };
          newStream = await navigator.mediaDevices.getUserMedia({ video: fallback, audio: false });
        }

        activeStream = newStream;
        const preview = document.getElementById('localPreview');
        preview.srcObject = newStream;
        await preview.play().catch(() => {});

        const newTrack = newStream.getVideoTracks()[0];
        const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) {
          await sender.replaceTrack(newTrack);
        }

        updateLocalLabel();
        sendCamInfo();
      } catch (err) {
        console.log('Loi doi cam:', err);
      } finally {
        isSwitching = false;
      }
    }
  </script>
</body>
</html>
