<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cam Gi&aacute;m S&aacute;t N&#7897;i B&#7897;</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #0d0d0d; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h2 { margin-top: 0; color: #4ade80; }
    .card { background: #1a1a1a; padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; text-align: center; margin-bottom: 16px; border: 1px solid #333; }
    button { background: #22c55e; color: #000; border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin: 6px 0; width: 100%; }
    button.secondary { background: #333; color: #fff; }
    button.switch-btn { background: #2563eb; color: #fff; margin-top: 12px; }
    button.dark-mode-btn { background: #111; color: #666; border: 1px solid #222; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; text-align: center; margin-bottom: 10px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; width: 100%; max-width: 1000px; }
    video { width: 100%; min-height: 220px; border-radius: 10px; background: #000; border: 1px solid #333; object-fit: cover; }
    .code-box { font-size: 28px; font-weight: bold; letter-spacing: 3px; color: #4ade80; background: #000; padding: 10px; border-radius: 8px; margin: 10px 0; user-select: all; }
    #stealthOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; color: #222; align-items: center; justify-content: center; flex-direction: column; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- MAN HINH CHON VAI TRO -->
  <div id="setupScreen" class="card">
    <h2>Cam Gi&aacute;m S&aacute;t Wi-Fi</h2>
    <p style="color:#aaa; font-size:14px;">K&#7871;t n&#7889;i 2 m&aacute;y chung 1 m&#7841;ng Wi-Fi</p>
    <button onclick="startViewer()">1. M&aacute;y C&#7847;m Theo (M&agrave;n H&igrave;nh Xem)</button>
    <hr style="border-color:#333; margin: 16px 0;">
    <input type="text" id="roomInput" placeholder="Nh&#7853;p m&atilde; ph&ograve;ng (VD: 1234)" />
    <button class="secondary" onclick="startSingleCamera('user')">2A. Ch&#7881; Camera Tr&#432;&#7899;c</button>
    <button class="secondary" onclick="startSingleCamera('environment')">2B. Ch&#7881; Camera Sau</button>
    <button class="secondary" onclick="startDualCamera()">2C. Th&#7917; M&#7903; C&#7843; 2 Camera C&ugrave;ng L&uacute;c</button>
    <button style="background:#eab308; color:#000;" onclick="startAlternatingCamera()">2D. Lu&acirc;n Phi&ecirc;n Tr&#432;&#7899;c &harr; Sau (M&#7895;i 4s)</button>
  </div>

  <!-- GIAO DIEN MAY XEM -->
  <div id="viewerScreen" class="card hidden">
    <div style="font-size:13px; color:#aaa;">Nh&#7853;p m&atilde; n&agrave;y v&agrave;o m&aacute;y &#273;&#7863;t &#7903; ngo&agrave;i:</div>
    <div id="myRoomId" class="code-box">&#272;ang t&#7841;o...</div>
    <div id="statusText" style="font-size:13px; color:#4ade80;">&#272;ang ch&#7901; camera k&#7871;t n&#7889;i...</div>
    <button id="remoteSwitchBtn" class="switch-btn hidden" onclick="sendSwitchCommand()">&#8644; &#272;&#7893;i Camera Tr&#432;&#7899;c / Sau Ngay</button>
  </div>
  <div id="videoGrid" class="video-grid"></div>

  <!-- GIAO DIEN MAY QUAY -->
  <div id="cameraScreen" class="card hidden">
    <div id="camModeLabel" style="color:#4ade80; font-weight:bold; margin-bottom:8px;">&#9679; &#272;ang ph&aacute;t tr&#7921;c ti&#7871;p (T&#7855;t Flash)</div>
    <video id="localPreview" autoplay muted playsinline style="max-height: 240px;"></video>
    <button class="dark-mode-btn" onclick="toggleStealth(true)">L&agrave;m T&#7889;i &#272;en M&agrave;n H&igrave;nh (Ti&#7871;t Ki&#7879;m Pin)</button>
  </div>

  <!-- MAN HINH DEN CHONG CHU Y -->
  <div id="stealthOverlay" onclick="toggleStealth(false)">
    <div>&#272;ang ch&#7841;y ng&#7847;m...</div>
    <small style="margin-top:8px;">Ch&#7841;m v&agrave;o m&agrave;n h&igrave;nh &#273;&#7875; hi&#7879;n l&#7841;i</small>
  </div>

  <script>
    let peer = null;
    let activeStream = null;
    let activeCall = null;
    let dataConn = null;
    let currentFacing = 'environment';
    let switchInterval = null;
    let isSwitching = false;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    async function keepAwake() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    function toggleStealth(show) {
      document.getElementById('stealthOverlay').style.display = show ? 'flex' : 'none';
    }

    // ================= 1. MAY XEM =================
    function startViewer() {
      const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('viewerScreen').classList.remove('hidden');
      keepAwake();

      peer = new Peer('cam-watch-' + randomCode, peerConfig);
      peer.on('open', () => {
        document.getElementById('myRoomId').innerText = randomCode;
      });

      // Nhan kenh dieu khien tu xa
      peer.on('connection', (conn) => {
        dataConn = conn;
        document.getElementById('remoteSwitchBtn').classList.remove('hidden');
      });

      // Nhan luong video
      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          document.getElementById('statusText').innerText = '\u0110\u00e3 k\u1ebft n\u1ed1i h\u00ecnh \u1ea3nh!';
          addOrUpdateVideo(remoteStream, call.peer);
        });
      });
    }

    function sendSwitchCommand() {
      if (dataConn && dataConn.open) {
        dataConn.send('SWITCH_NOW');
      }
    }

    function addOrUpdateVideo(stream, id) {
      let vid = document.getElementById('vid-' + id);
      if (!vid) {
        vid = document.createElement('video');
        vid.id = 'vid-' + id;
        vid.muted = true;
        vid.autoplay = true;
        vid.playsInline = true;
        vid.setAttribute('muted', '');
        vid.setAttribute('autoplay', '');
        vid.setAttribute('playsinline', '');
        document.getElementById('videoGrid').appendChild(vid);
      }
      vid.srcObject = stream;
      vid.play().catch(() => {});
    }

    // ================= 2A & 2B. 1 CAMERA =================
    async function startSingleCamera(facingMode) {
      const roomCode = document.getElementById('roomInput').value.trim();
      if (!roomCode) return alert('Vui l\u00f2ng nh\u1eadp m\u00e3 ph\u00f2ng!');

      try {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        setupCameraUI(roomCode, activeStream);
      } catch (err) {
        alert('L\u1ed7i m\u1edf camera: ' + err.message);
      }
    }

    // ================= 2C. THU MO 2 CAMERA CUNG LUC =================
    async function startDualCamera() {
      const roomCode = document.getElementById('roomInput').value.trim();
      if (!roomCode) return alert('Vui l\u00f2ng nh\u1eadp m\u00e3 ph\u00f2ng!');

      try {
        const stream1 = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        const stream2 = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });

        setupCameraUI(roomCode, stream1, stream2);
      } catch (err) {
        alert('Thi\u1ebft b\u1ecb t\u1eeb ch\u1ed1i m\u1edf c\u00f9ng l\u00fac 2 camera (' + err.name + '). H\u00e3y d\u00f9ng n\u00fat 2D Lu\u00e2n Phi\u00ean!');
      }
    }

    // ================= 2D. LUAN PHIEN TRUOC <-> SAU =================
    async function startAlternatingCamera() {
      const roomCode = document.getElementById('roomInput').value.trim();
      if (!roomCode) return alert('Vui l\u00f2ng nh\u1eadp m\u00e3 ph\u00f2ng!');

      try {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing, width: { ideal: 960 }, height: { ideal: 540 } },
          audio: false
        });
        setupCameraUI(roomCode, activeStream);
        document.getElementById('camModeLabel').innerText = '\u25cf Ch\u1ebf \u0111\u1ed9 lu\u00e2n phi\u00ean Tr\u01b0\u1edbc \u2194 Sau (4 gi\u00e2y/l\u1ea7n)';

        // Tu dong doi camera moi 4 giay
        switchInterval = setInterval(() => {
          performCameraSwitch();
        }, 4000);
      } catch (err) {
        alert('L\u1ed7i kh\u1edfi \u0111\u1ed9ng camera: ' + err.message);
      }
    }

    async function performCameraSwitch() {
      if (isSwitching || !activeCall) return;
      isSwitching = true;

      try {
        // 1. Tat camera hien tai de giai phong phan cung cho iOS
        if (activeStream) {
          activeStream.getTracks().forEach(track => track.stop());
        }

        // 2. Dao chieu camera
        currentFacing = (currentFacing === 'environment') ? 'user' : 'environment';

        // 3. Mo camera moi
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing, width: { ideal: 960 }, height: { ideal: 540 } },
          audio: false
        });

        activeStream = newStream;
        document.getElementById('localPreview').srcObject = newStream;

        // 4. Thay the luong video dang truyen sang may xem ma khong bi ngat ket noi
        const newVideoTrack = newStream.getVideoTracks()[0];
        const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) {
          await sender.replaceTrack(newVideoTrack);
        }
      } catch (e) {
        console.log('Bo qua nhip chuyen:', e);
      } finally {
        isSwitching = false;
      }
    }

    function setupCameraUI(roomCode, stream1, stream2 = null) {
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('cameraScreen').classList.remove('hidden');
      const preview = document.getElementById('localPreview');
      preview.srcObject = stream1;
      preview.play().catch(() => {});
      keepAwake();

      peer = new Peer(peerConfig);
      peer.on('open', () => {
        // Mo kenh nhan lenh dieu khien tu may xem
        const conn = peer.connect('cam-watch-' + roomCode);
        conn.on('data', (data) => {
          if (data === 'SWITCH_NOW') {
            clearInterval(switchInterval); // Dung tu dong neu nguoi dung bam chuyen tay
            performCameraSwitch();
          }
        });

        // Phat luong chinh
        activeCall = peer.call('cam-watch-' + roomCode, stream1);

        // Neu co luong thu 2 (che do 2C) thi tao them 1 ket noi phu
        if (stream2) {
          setTimeout(() => {
            const peer2 = new Peer(peerConfig);
            peer2.on('open', () => {
              peer2.call('cam-watch-' + roomCode, stream2);
            });
          }, 800);
        }
      });
    }
  </script>
</body>
</html>
